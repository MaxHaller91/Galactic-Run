<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuka Seek Behavior Tutorial</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: white; 
            font-family: Arial; background: rgba(0,0,0,0.5); padding: 10px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info"></div>
    <script src="https://cdn.jsdelivr.net/npm/yuka@0.7.8/build/yuka.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Initial info panel
        document.getElementById('info').innerHTML = `
            Seek Behavior: Cone chases Sphere<br>
            Target moves every 2 seconds<br>
            <small>Mouse: Left=Orbit, Right=Pan, Scroll=Zoom</small>
        `;
        
        // Scene setup (same as combat tutorial)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Camera controls (proper OrbitControls)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 20;
        
        // Yuka setup
        const entityManager = new YUKA.EntityManager();
        const time = new YUKA.Time();
        
        // Create vehicle
        const vehicle = new YUKA.Vehicle();
        vehicle.maxSpeed = 3;
        
        // Vehicle mesh (cone)
        const vehicleGeometry = new THREE.ConeGeometry(0.1, 0.5, 8);
        vehicleGeometry.rotateX(Math.PI * 0.5);
        const vehicleMaterial = new THREE.MeshNormalMaterial();
        const vehicleMesh = new THREE.Mesh(vehicleGeometry, vehicleMaterial);
        vehicleMesh.matrixAutoUpdate = false;
        scene.add(vehicleMesh);
        
        // Sync function
        function sync(entity, renderComponent) {
            renderComponent.matrix.copy(entity.worldMatrix);
        }
        
        vehicle.setRenderComponent(vehicleMesh, sync);
        entityManager.add(vehicle);
        
        // Create target entity
        const targetEntity = new YUKA.GameEntity();
        targetEntity.position.set(2, 0, 0);
        
        // Target mesh (sphere)
        const targetGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const targetMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const targetMesh = new THREE.Mesh(targetGeometry, targetMaterial);
        targetMesh.matrixAutoUpdate = false;
        scene.add(targetMesh);
        
        targetEntity.setRenderComponent(targetMesh, sync);
        entityManager.add(targetEntity);
        
        // Create and add seek behavior
        const seekBehavior = new YUKA.SeekBehavior(targetEntity.position);
        vehicle.steering.add(seekBehavior);
        
        // Move target every 2 seconds
        setInterval(() => {
            targetEntity.position.set(
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 8, 
                (Math.random() - 0.5) * 8
            );
        }, 2000);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = time.update().getDelta();
            entityManager.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
