<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuka Arrive Behavior Tutorial</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: white; 
            font-family: Arial; background: rgba(0,0,0,0.5); padding: 10px;
        }
    </style>
</head>
<body>
    <div id="info"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/yuka@0.7.8/build/yuka.min.js"></script>
    <script type="module">
        import { setupCameraNavigation, updateCameraControls, createInfoPanel, createStandardScene } from './tutorial-utils.js';
        
        // Update info panel
        document.getElementById('info').innerHTML = createInfoPanel(
            'Arrive Behavior: Cone smoothly decelerates to Sphere',
            'Deceleration: 3 (default), Stopping Distance: 0.2'
        );
        
        // Scene setup using utility
        const { scene, camera, renderer } = createStandardScene();
        const controls = setupCameraNavigation(camera, renderer);
        
        // Yuka setup
        const entityManager = new YUKA.EntityManager();
        const time = new YUKA.Time();
        
        // Create vehicle
        const vehicle = new YUKA.Vehicle();
        vehicle.maxSpeed = 3;
        
        // Vehicle mesh (cone)
        const vehicleGeometry = new THREE.ConeGeometry(0.1, 0.5, 8);
        vehicleGeometry.rotateX(Math.PI * 0.5);
        const vehicleMaterial = new THREE.MeshNormalMaterial();
        const vehicleMesh = new THREE.Mesh(vehicleGeometry, vehicleMaterial);
        vehicleMesh.matrixAutoUpdate = false;
        scene.add(vehicleMesh);
        
        // Sync function
        function sync(entity, renderComponent) {
            renderComponent.matrix.copy(entity.worldMatrix);
        }
        
        vehicle.setRenderComponent(vehicleMesh, sync);
        entityManager.add(vehicle);
        
        // Create target entity  
        const targetEntity = new YUKA.GameEntity();
        targetEntity.position.set(2, 0, 0);
        
        // Target mesh (sphere)
        const targetGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const targetMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const targetMesh = new THREE.Mesh(targetGeometry, targetMaterial);
        targetMesh.matrixAutoUpdate = false;
        scene.add(targetMesh);
        
        targetEntity.setRenderComponent(targetMesh, sync);
        entityManager.add(targetEntity);
        
        // Create and add ARRIVE behavior (not seek)
        const arriveBehavior = new YUKA.ArriveBehavior(targetEntity.position, 3, 0.2);
        vehicle.steering.add(arriveBehavior);
        
        // Move target every 3 seconds (slower to see deceleration effect)
        setInterval(() => {
            targetEntity.position.set(
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 6
            );
        }, 3000);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = time.update().getDelta();
            entityManager.update(delta);
            
            updateCameraControls(controls);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
