<!DOCTYPE html>
<html>
<head>
    <title>Yuka Basic Combat Tutorial</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: white; 
            font-family: Arial; background: rgba(0,0,0,0.5); padding: 10px;
        }
        #controls {
            position: absolute; bottom: 10px; left: 10px; color: white;
            font-family: Arial; background: rgba(0,0,0,0.5); padding: 10px;
        }
    </style>
    <!-- Import map for Three.js and addons -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">
        Basic Ship Combat<br>
        Red ship (AI) pursues and fires at Blue ship (Player)<br>
        <small>Mouse: Left=Orbit, Right=Pan, Scroll=Zoom</small>
    </div>
    <div id="controls">
        WASD: Move Player Ship | Space: Fire | Left-drag: Orbit | Right-drag: Pan | Wheel: Zoom
    </div>
    
    <!-- Load Yuka from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/yuka@0.7.8/build/yuka.min.js"></script>
    
    <!-- Main application script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Camera controls (proper OrbitControls)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 20;
        
        // Yuka setup
        const entityManager = new YUKA.EntityManager();
        const time = new YUKA.Time();
        
        // Game state
        const projectiles = [];
        const gameState = {
            playerHealth: 100,
            enemyHealth: 100,
            gameOver: false
        };
        
        // Combat Ship class
        class CombatShip extends YUKA.Vehicle {
            constructor(color = 0x00ff00, isPlayer = false) {
                super();
                this.maxSpeed = 4;
                this.maxForce = 8;
                this.health = 100;
                this.maxHealth = 100;
                this.isPlayer = isPlayer;
                this.lastFireTime = 0;
                this.fireRate = 500; // milliseconds between shots
                
                // Create ship mesh
                const geometry = new THREE.ConeGeometry(0.3, 1, 8);
                geometry.rotateX(Math.PI / 2); // Point forward
                this.mesh = new THREE.Mesh(
                    geometry, 
                    new THREE.MeshLambertMaterial({ color: color })
                );
                this.mesh.matrixAutoUpdate = false;
                scene.add(this.mesh);
                
                // Create health bar
                this.createHealthBar();
                
                // Sync mesh with Yuka entity
                this.setRenderComponent(this.mesh, (entity, renderComponent) => {
                    renderComponent.matrix.copy(entity.worldMatrix);
                });
            }
            createHealthBar() {
                // Health bar background
                const bgGeometry = new THREE.PlaneGeometry(1, 0.1);
                this.healthBarBg = new THREE.Mesh(
                    bgGeometry,
                    new THREE.MeshBasicMaterial({ color: 0x444444 })
                );
                
                // Health bar fill
                this.healthBarFill = new THREE.Mesh(
                    bgGeometry.clone(),
                    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
                );
                
                scene.add(this.healthBarBg);
                scene.add(this.healthBarFill);
            }
            
            updateHealthBar() {
                const healthPercent = this.health / this.maxHealth;
                
                // Position above ship
                const position = this.position.clone();
                position.y += 1;
                this.healthBarBg.position.copy(position);
                this.healthBarFill.position.copy(position);
                this.healthBarFill.position.z += 0.01; // Slightly in front
                
                // Scale health bar fill
                this.healthBarFill.scale.x = healthPercent;
                
                // Color based on health
                if (healthPercent > 0.6) {
                    this.healthBarFill.material.color.setHex(0x00ff00); // Green
                } else if (healthPercent > 0.3) {
                    this.healthBarFill.material.color.setHex(0xffff00); // Yellow
                } else {
                    this.healthBarFill.material.color.setHex(0xff0000); // Red
                }
            }
            
            takeDamage(amount) {
                this.health = Math.max(0, this.health - amount);
                
                // Flash red when hit
                const originalColor = this.mesh.material.color.getHex();
                this.mesh.material.color.setHex(0xff0000);
                setTimeout(() => {
                    this.mesh.material.color.setHex(originalColor);
                }, 100);
                
                return this.health <= 0;
            }
            
            fire() {
                const now = performance.now();
                if (now - this.lastFireTime < this.fireRate) return false;
                
                this.lastFireTime = now;
                
                // Create projectile
                const projectile = new Projectile(
                    this.position.clone(),
                    this.forward.clone(),
                    this.isPlayer ? 0x00ffff : 0xff0000,
                    this
                );
                projectiles.push(projectile);
                
                return true;
            }
        }
        
        // Projectile class
        class Projectile {
            constructor(position, direction, color, owner) {
                this.owner = owner;
                this.speed = 15;
                this.damage = 20;
                this.lifetime = 3000; // 3 seconds
                this.birthTime = performance.now();
                
                // Projectile mesh
                const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                this.mesh = new THREE.Mesh(
                    geometry,
                    new THREE.MeshBasicMaterial({ color: color })
                );
                this.mesh.position.copy(position);
                scene.add(this.mesh);
                
                // Velocity
                this.velocity = direction.multiplyScalar(this.speed);
            }
            
            update(deltaTime) {
                // Move projectile
                this.mesh.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                
                // Check lifetime
                return (performance.now() - this.birthTime) < this.lifetime;
            }
            
            checkCollision(target) {
                if (target === this.owner) return false;
                
                const distance = this.mesh.position.distanceTo(target.position);
                return distance < 0.5; // Hit radius
            }
            
            destroy() {
                scene.remove(this.mesh);
            }
        }
        
        // Create player ship (blue)
        const playerShip = new CombatShip(0x0066ff, true);
        playerShip.position.set(-3, 0, 0);
        entityManager.add(playerShip);
        
        // Create enemy ship (red)
        const enemyShip = new CombatShip(0xff3333, false);
        enemyShip.position.set(20, 0, 0);
        
        // Add pursuit behavior to enemy
        const pursuitBehavior = new YUKA.PursuitBehavior(playerShip);
        pursuitBehavior.maxPrediction = 1;
        enemyShip.steering.add(pursuitBehavior);
        entityManager.add(enemyShip);
        
        // Add some lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 0.4));
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (event) => {
            keys[event.code] = true;
        });
        document.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });
        
        function handleInput(deltaTime) {
            if (gameState.gameOver) return;
            
            const force = new YUKA.Vector3();
            const moveSpeed = 10;
            
            if (keys['KeyW']) force.z -= moveSpeed;
            if (keys['KeyS']) force.z += moveSpeed;
            if (keys['KeyA']) force.x -= moveSpeed;
            if (keys['KeyD']) force.x += moveSpeed;
            
            if (force.length() > 0) {
                playerShip.steering.clear();
                playerShip.velocity.add(force.multiplyScalar(deltaTime));
                playerShip.velocity.multiplyScalar(0.95); // Damping
            }
            
            if (keys['Space']) {
                playerShip.fire();
            }
        }
        
        function updateProjectiles(deltaTime) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const projectile = projectiles[i];
                
                if (!projectile.update(deltaTime)) {
                    // Projectile expired
                    projectile.destroy();
                    projectiles.splice(i, 1);
                    continue;
                }
                
                // Check collisions
                const targets = [playerShip, enemyShip];
                for (const target of targets) {
                    if (projectile.checkCollision(target)) {
                        const destroyed = target.takeDamage(projectile.damage);
                        
                        // Update game state
                        if (target.isPlayer) {
                            gameState.playerHealth = target.health;
                        } else {
                            gameState.enemyHealth = target.health;
                        }
                        
                        if (destroyed) {
                            gameState.gameOver = true;
                            console.log(target.isPlayer ? 'Game Over!' : 'Victory!');
                        }
                        
                        projectile.destroy();
                        projectiles.splice(i, 1);
                        break;
                    }
                }
            }
        }
        
        function updateAI() {
            if (gameState.gameOver) return;
            
            // Enemy auto-fire when close enough
            const distanceToPlayer = enemyShip.position.distanceTo(playerShip.position);
            if (distanceToPlayer < 5) {
                enemyShip.fire();
            }
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = time.update().getDelta();
            
            handleInput(deltaTime);
            entityManager.update(deltaTime);
            updateProjectiles(deltaTime);
            updateAI();
            
            // Update health bars
            playerShip.updateHealthBar();
            enemyShip.updateHealthBar();
            
            // Update info panel
            document.getElementById('info').innerHTML = `
                Basic Ship Combat<br>
                Player Health: ${Math.round(gameState.playerHealth)} | Enemy Health: ${Math.round(gameState.enemyHealth)}<br>
                <small>Mouse: Left=Orbit, Right=Pan, Scroll=Zoom</small>
            `;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
